services:
  db:
    image: postgis/postgis:18-3.6
    container_name: ridehailing-postgres
    restart: unless-stopped

    environment:
      # PostgreSQL administrator/database
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # BiyahePro application database account
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      # PostgreSQL 18 persistent data
      - ridehailing-postgres-data:/var/lib/postgresql

      # BiyahePro database initialization scripts
      - ./ridehailing-db:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./RideHailing.API
      dockerfile: Dockerfile
    container_name: ridehailing-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Overrides appsettings.json's "Host=localhost" — inside the compose
      # network the DB is reachable at the service name "db", not localhost.
      # Values come from the same .env used by the db service above, so the
      # app-role credentials always match what 00_role.sh actually created.
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASSWORD}

    ports:
      # Host 5000 matches what the mobile app's API_BASE_URL already assumes.
      - "5000:8080"

volumes:
  ridehailing-postgres-data: