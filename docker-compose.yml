services:
  db:
    image: postgis/postgis:18-3.6
    container_name: ridehailing-postgres
    restart: unless-stopped

    environment:
      # PostgreSQL administrator/database
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # BiyahePro application database account
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      # PostgreSQL 18 persistent data
      - ridehailing-postgres-data:/var/lib/postgresql

      # BiyahePro database initialization scripts
      - ./ridehailing-db:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ridehailing-postgres-data: